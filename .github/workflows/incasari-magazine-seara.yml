name: Incasari magazine seara

on:
  schedule:
    - cron: '*/15 17,18,19,20 * * *'
  workflow_dispatch:

concurrency:
  group: incasari-magazine-seara
  cancel-in-progress: false

jobs:
  trimite:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trimite incasari seara pe Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/incasari_magazine_seara.py
