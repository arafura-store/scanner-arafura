name: Sold caiet seara

on:
  schedule:
    - cron: '*/15 17,18,19 * * *'
  workflow_dispatch:

concurrency:
  group: sold-caiet-seara
  cancel-in-progress: false

jobs:
  trimite:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trimite sold seara pe WhatsApp
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY_2: ${{ secrets.CALLMEBOT_APIKEY_LIVIA }}
          CALLMEBOT_PHONE_2: ${{ secrets.CALLMEBOT_PHONE_LIVIA }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sold_caiet_seara.py
